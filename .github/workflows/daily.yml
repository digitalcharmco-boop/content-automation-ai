name: Daily Content Pipeline

on:
  schedule:
    - cron: "0 9 * * *"   # 9 AM UTC daily
  workflow_dispatch:        # allow manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run content pipeline
        env:
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY:        ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:       ${{ secrets.ELEVENLABS_VOICE_ID }}
          TIKTOK_CLIENT_KEY:         ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET:      ${{ secrets.TIKTOK_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:     ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CONVERTKIT_API_KEY:        ${{ secrets.CONVERTKIT_API_KEY }}
          CONVERTKIT_SEQUENCE_ID:    ${{ secrets.CONVERTKIT_SEQUENCE_ID }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
        run: python run_full_automation.py

      - name: Upload generated assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ github.run_number }}
          path: |
            content_production/
            social_analytics/
          retention-days: 7

  run-tests:
    runs-on: ubuntu-latest
    needs: []   # runs in parallel with run-pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run test suite
        run: pytest --cov=. --cov-report=term-missing -q

      - name: Open issue on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Tests failed on daily run #${context.runNumber}`,
              body:  `Daily pipeline test suite failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["bug", "automated"],
            })
